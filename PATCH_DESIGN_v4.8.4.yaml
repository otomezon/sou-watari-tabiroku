patch:
  project: 層渡りの旅録
  version: 4.8.4
  previous_version: 4.8.3
  title: 回復・装備ドロップ・敵レベル進行・倍速個体のバランス調整
  item_recovery:
    calculation: 使用時に保存済み基礎値へ倍率を適用。既存・新規アイテム共通。
    rounding: Math.round
    food: { effect: hungerRestore, multiplier: 1.25, examples: "26→33、38→48、90→113" }
    potion: { effect: HP heal, multiplier: 1.75, examples: "8→14、15→26、125→219", secondary_hunger_restore: unchanged }
    caps: { hp: player.maxHp, hunger: MAX_HUNGER=120 }
    legacy_save: 基礎値を変更せず、持ち物・店・未払い商品一覧の説明を実回復量へ更新。
  drop_rates:
    floor_cache:
      change: 装備+2ポイント、ポーション-2ポイント、食料は維持
      tutorial: { equipment: "17%→19%", food: "40%維持", potion: "43%→41%" }
      beginner: { equipment: "16%→18%", food: "39%維持", potion: "45%→43%" }
      intermediate: { equipment: "16%→18%", food: "37%維持", potion: "47%→45%" }
      advanced: { equipment: "17%→19%", food: "35%維持", potion: "48%→46%" }
      expert: { equipment: "18%→20%", food: "34%維持", potion: "48%→46%" }
    regular_monsters:
      tutorial: { equipment: "1.0%→1.1%", potion: "3.2%→3.0%", food: "2.8%維持" }
      beginner: { equipment: "1.0%→1.1%", potion: "2.8%→2.6%", food: "2.0%維持" }
      intermediate: { equipment: "1.1%→1.2%", potion: "2.7%→2.5%", food: "1.8%維持" }
      advanced: { equipment: "1.2%→1.3%", potion: "2.6%→2.4%", food: "1.6%維持" }
      expert: { equipment: "1.3%→1.4%", potion: "2.4%→2.2%", food: "1.4%維持" }
    rare_monsters: { premium_equipment: "18%→19%", premium_potion: "5%→4%", valuable: "7%維持", food: "5%維持" }
    shop_stock_and_prices: unchanged
  monster_level_progression:
    stat_scale: "difficultyScale × (1 + floorProgress × 0.40) を維持"
    previous: "floor(progress × maxMonsterTier) による段階切り替え"
    new: 各敵生成時に隣接Tierを混合し、smoothstepで上位Tier率を滑らかに上げる。
    tier_position: "clamp(progress,0,1) × (maxMonsterTier - 1)"
    probability: "t² × (3 - 2t)"
    guarantee: 最終通常階とボス支援敵は最上位Tierへ到達
    visible_level: "max(1, round((maxHp + attack × 6 + defense × 4) / 36))"
  fast_enemy:
    preserve: 1プレイヤーターン2回行動
    rare_variant: { hp: "1.32→1.25倍", attack: "1.35→1.20倍", defense: "+2→+1", exp: "2.5→2.3倍" }
    fast_boss_attack: "0.85→0.80倍"
    fast_boss_hp: "0.93倍（維持）"
    shopkeeper_attack: "(14 + floor×1.1 + round(difficultyScale×2)) × 0.90"
    slow_variant: unchanged
  compatibility:
    save_schema: 11
    migration_required: false
    stored_item_values_rewritten: false
  acceptance:
    - 食料1.25倍、ポーションHP1.75倍、ポーション付随満腹度は据え置き。
    - フロア・敵の装備ドロップ率を微増、ポーション率を少し低下。
    - 隣接Tierを滑らかに混合し、階層境界の一斉切替をなくす。
    - fast能力を下げ、2回行動は維持。
    - 旧セーブ内アイテムにも新効果を適用し、v11を維持。
