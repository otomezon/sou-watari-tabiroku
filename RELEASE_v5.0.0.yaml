    defense_growth: 1
    defense_growth_interval_levels: 2
    prey: nearest_non_boss_non_shopkeeper_non_hunter_monster
    fallback_target: player
  save:
    previous_schema: 11
    schema: 12
    migration_required: false
    migration: automatic_preserve_current_run
  pwa:
    app_version: 5.0.0
    manifest_version: 5.0.0
    service_worker_cache: sou-watari-tabiroku-v5-0-0
