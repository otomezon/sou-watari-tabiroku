patch:
  project: 層渡りの旅録
  version: 4.9.2
  previous_version: 4.9.1
  release_type: patch
  title: レベルアップファンファーレ再設計・撃破時の効果音整理

  references:
    - work: 風来のシレン6
      direction: プレイヤーのレベルアップを独立した短いジングルとして扱う構成
    - work: トルネコの大冒険
      direction: レベルアップ専用の短い楽曲による節目の演出
    - work: JRPGファンファーレの音楽的慣習
      direction: 終止和音で達成感を明確にする構成
    copyright_boundary:
      copied_melody: false
      sampled_recording: false
      existing_game_audio: false
      implementation: Web Audio APIによるオリジナル合成

  level_up_fanfare:
    asset: null
    implementation: assets/audio.js playLevelUpFanfare()
    duration_seconds: 2.95
    musical_key: D major
    harmonic_progression:
      - G major (IV)
      - A major (V)
      - D major (I)
    melody_shape:
      - D5-B4-D5-G5
      - E5-C#5-E5-A5
      - F#5-A5-D6
    arrangement:
      - 金管風の短い主旋律
      - 柔らかな三和音のストリングス風伴奏
      - ルート音の低音アクセント
      - 最後の主和音に重ねるベル音
    playback:
      event_key: level
      synthesis: Web Audio API
      next_cue_delay_seconds: 3.05
      offline: アプリコードに含まれるため追加音声ファイル不要

  combat_feedback:
    player_attack:
      play_on_attack_input: true
      also_play_when_target_is_defeated: true
    enemy_defeat:
      separate_defeat_cue: false
      experience_pickup_cue: false
      actual_level_up_fanfare: true
    cue_order:
      - attack
      - level_up_if_gained
      - received_damage
      - terminal_result_if_any

  versioning:
    app_version: 4.9.2
    manifest_version: 4.9.2
    service_worker_cache: sou-watari-tabiroku-v4-9-2
    level_up_audio_asset: none

  compatibility:
    save_schema: 11
    migration_required: false
    gameplay_balance: v4.9.1を維持

  acceptance:
    - 攻撃で敵を倒した場合にも攻撃音が鳴る。
    - 敵撃破だけを理由にしたdefeat効果音を再生しない。
    - 実際にレベルアップした場合のみレベルアップファンファーレを再生する。
    - ファンファーレはDメジャーのG-A-D進行を持つオリジナル旋律である。
    - ファンファーレはWeb Audio APIで合成し外部音声ファイルに依存しない。
    - 攻撃・レベルアップ・被弾・結果音の再生順序を維持する。
    - Service WorkerキャッシュとPWAバージョンを4.9.2へ更新する。
    - セーブスキーマv11を維持する。
