release:
  project: 層渡りの旅録
  version: 4.8.0
  previous_version: 4.7.3
  type: minor
  movement:
    player_directions: 8
    monster_directions: 8
    detection_radius_metric: chebyshev_14_step_radius
    action_cost_per_move: 1_turn
    diagonal_attack: enabled_for_player_and_monsters
    corner_cutting: forbidden
    diagonal_movement_requires_both_adjacent_orthogonal_tiles_walkable: true
  controls:
    layout: 3x3_eight_way
    wait_position: center
    directional_buttons: 8
  balance:
    monster_action_frequency_changed: false
    monster_attack_damage_changed: false
    note: 斜めからの攻撃が加わるため、部屋内の接敵と被弾機会は増える。攻撃回数・威力は据え置き。
  compatibility:
    save_schema: 11
    migration_required: false
  verification:
    node_tests: 115/115
    layout_tests: 11/11
    dedicated_diagonal_tests: 10/10
    browser_typescript: pass
    standalone_preview: pass
