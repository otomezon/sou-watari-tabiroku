patch:
  project: 層渡りの旅録
  version: 4.8.3
  previous_version: 4.8.2
  title: 敵レベル表示（能力値連動）
  category: gameplay_ui
  purpose: 敵の実際の能力値を小さなレベル表示へ要約し、遭遇時の危険度判断を助ける。
  scope:
    modified_modules:
      - RenderManager
      - EnemyLevel（表示専用の純粋関数）
    unchanged_modules:
      - MonsterManagerの出現・能力値補正
      - BattleManagerのダメージ計算・行動周期
      - SaveManager
      - DungeonGenerator
  level_calculation:
    semantic: 敵の能力値から算出した相対的な強さの目安。プレイヤーのレベルと同じ成長系列ではない。
    source_values:
      hp: monster.maxHp
      hp_fallback: monster.hp（maxHpが存在しない旧データ等の場合のみ）
      attack: monster.attack
      defense: monster.defense
    excluded_values:
      - 現在HP（戦闘中に減少するため）
      - EXP
      - actionSpeedそのもの（鈍足・倍速は別印で示す）
    formula: "Math.max(1, Math.round((maxHp + attack * 6 + defense * 4) / 36))"
    coefficients:
      hp_weight: 1
      attack_weight: 6
      defense_weight: 4
      points_per_level: 36
      rounding: nearest_integer
      minimum_level: 1
    calculation_timing: 描画時に現在の敵オブジェクトの確定能力値から導出する。キャンペーン・階層補正と希少形態補正の適用後の値を使う。
    stability: maxHpを使うため、敵がダメージを受けてもレベル表示は変化しない。
    examples:
      tier1_slime: "maxHp=12, attack=4, defense=0 → Lv1"
      tier1_stone_imp: "maxHp=16, attack=5, defense=2 → Lv2"
      tutorial_boss_normal: "maxHp=82, attack=10, defense=2 → Lv4"
      expert_boss_normal: "maxHp=640, attack=38, defense=12 → Lv25"
  canvas_ui:
    target: 敵スプライトの左下
    tile_size_px: 32
    label: Lv{level}
    badge:
      anchor: bottom_left
      x_offset_px: 1
      y_offset_px: 23
      height_px: 9
      max_width_px: 18
      font_px: 6
      min_font_px: 4
      background: translucent_dark
      text: pale_gold
      boss_background: dark_crimson
    rare_speed_badge:
      position: bottom_right
      preserved: true
      slow: "½"
      fast: "Ⅱ"
      normal_rare_boss: "★"
    health_bar:
      position: top_edge
      preserved: true
    target_entities:
      - 通常魔物
      - 鈍足レア魔物
      - 倍速レア魔物
      - ボス
      - 敵対状態になった石翼の番商
    passive_shopkeeper: 店内で非敵対の間は敵として扱わず、レベル表示しない。
    visibility: 既存Canvas描画範囲にいる敵だけに表示する。
    legend: "Lv＝敵の能力値目安 · 希少個体：½鈍足・Ⅱ倍速"
    enemy_count_policy: 魔物の正確な数は引き続きUIに表示しない。
  gameplay:
    display_only: true
    combat_values_changed: false
    monster_spawn_changed: false
    enemy_ai_changed: false
    action_speed_changed: false
    loot_and_exp_changed: false
  compatibility:
    save_schema: 11
    schema_change: false
    migration_required: false
    persisted_level_field: false
    legacy_saves: 保存済みのmaxHp・attack・defenseからレベルを導出する。maxHpが欠ける場合はhpを代替使用する。
    offline_cache: sou-watari-tabiroku-v4-8-3
  acceptance_criteria:
    - 全ての描画対象敵にLv表示が付く（非敵対の店主を除く）。
    - 敵のレベルはmaxHp・attack・defenseのみから導出される。
    - 現在HPが減ってもレベル表示は変わらない。
    - 鈍足・倍速・ボスの既存マーカーを維持し、レベル表示と重ならない。
    - 32pxタイル内に収まり、画面幅を変更しない。
    - 戦闘・AI・出現率・報酬・セーブ形式に変更がない。
    - 魔物の正確な出現数をUIへ追加表示しない。
    - v4.8.2以前のセーブを移行なしで読み込める。
