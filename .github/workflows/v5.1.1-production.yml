name: v5.1.1 production checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js assets/*.mjs; do
            node --check "$file"
          done
      - name: Run v5.1.1 regression tests
        run: node --test tests/v5.1.1-expert-early-spawns.test.mjs
